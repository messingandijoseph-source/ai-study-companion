version: "3.9"

services:
  user_service_postgres:
    image: postgres:15
    container_name: user_service_postgres
    restart: always
    environment:
      POSTGRES_USER: user_service_user
      POSTGRES_PASSWORD: user_service_pass
      POSTGRES_DB: user_service_db
    ports:
      - "5433:5432"
    volumes:
      - user_service_data:/var/lib/postgresql/data

volumes:
  user_service_data:
